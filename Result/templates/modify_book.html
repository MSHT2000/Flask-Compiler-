{% extends "layout.html" %}
{% block title %}تعديل {{ book.title }} · LibraryHub{% endblock %}
{% block body %}
<div class="page-header">
  <div>
    <h1>تعديل كتاب</h1>
    <p class="dim">تعديل <strong>{{ book.title }}</strong> (#{{ book.id }})</p>
  </div>
  <a class="btn btn-ghost" href="{{ url_for('details_book', bid=book.id) }}">← رجوع للتفاصيل</a>
</div>

<form class="form-box" method="post" action="{{ url_for('edit_book', bid=book.id) }}">
  {% include "book_form.html" %}
  <div class="form-actions">
    <button type="submit" class="btn btn-main">حفظ التعديلات</button>
    <a class="btn btn-ghost" href="{{ url_for('details_book', bid=book.id) }}">إلغاء</a>
  </div>
</form>
{% endblock %}
